<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foresight — Think. Try. Learn.</title>
    <meta name="description" content="A private decision journal. Clarify a choice, try a small experiment, and carry what you learn into your next decision." />
    <meta property="og:title" content="Foresight — a decision journal that learns with you" />
    <meta property="og:description" content="Make a decision. Test your assumptions. Learn from what happens next." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#34674f" />
    <script>
      try {
        const savedTheme = localStorage.getItem('foresight-theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101923' : '#34674f';
      } catch {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/firebase-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
